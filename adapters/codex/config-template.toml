# Example Codex adapter config

[agents.planner]
description = "Create implementation-ready plans for substantial changes without modifying code."
config_file = "./agents/planner.toml"

[agents.implementer]
description = "Implement approved multi-file changes end-to-end while preserving repository conventions."
config_file = "./agents/implementer.toml"

[agents.quick_implementer]
description = "Deliver small, low-risk updates quickly with proportionate verification."
config_file = "./agents/quick-implementer.toml"

[agents.debugger]
description = "Investigate defects with evidence-driven root-cause analysis and deliver minimal safe fixes."
config_file = "./agents/debugger.toml"

[agents.reviewer]
description = "Perform read-only quality review focused on correctness, security, regressions, and missing tests."
config_file = "./agents/reviewer.toml"

[agents.documenter]
description = "Document implemented changes and verification evidence clearly and accurately."
config_file = "./agents/documenter.toml"

[agents.git_integrator]
description = "Safely perform explicitly authorized Git delivery actions: commit, push, and PR updates."
config_file = "./agents/git-integrator.toml"
